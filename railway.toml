# Railway Configuration
# Este arquivo configura o deploy automático no Railway

# FORÇA uso do Dockerfile (não usa Procfile ou nixpacks)
[build]
builder = "dockerfile"

# IMPORTANTE: Não definir startCommand aqui!
# O Dockerfile já define o ENTRYPOINT que será usado
# Se houver startCommand definido no painel do Railway, REMOVA!

# Configurações de ambiente
[deploy.environment]
DEBUG = "False"
DJANGO_SETTINGS_MODULE = "barbearia.settings"

# Health check (apenas o path)
healthcheckPath = "/"
