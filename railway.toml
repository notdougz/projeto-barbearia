# Railway Configuration
# Este arquivo configura o deploy automático no Railway

# Configurações do projeto
# Railway detecta automaticamente o Dockerfile, então não precisa especificar builder
# [build]
# builder = "dockerfile"  # Railway detecta automaticamente

# Configurações de ambiente
[deploy.environment]
DEBUG = "False"
DJANGO_SETTINGS_MODULE = "barbearia.settings"

# Health check (apenas o path)
healthcheckPath = "/"
