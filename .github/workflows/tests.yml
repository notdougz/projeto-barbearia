name: Testes Básicos

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quick-test:
    name: Testes Rápidos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar migrações
        run: |
          python manage.py migrate --noinput

      - name: Executar testes básicos
        run: |
          python manage.py test agendamentos.tests.ClienteModelTest agendamentos.tests.ServicoModelTest

      - name: Verificar Django
        run: |
          python manage.py check --deploy || echo "Avisos do Django check (não crítico)"

      - name: Teste de cobertura rápida
        run: |
          coverage run --source='agendamentos' manage.py test agendamentos.tests.ClienteModelTest agendamentos.tests.ServicoModelTest || echo "Cobertura pode ter problemas, mas continuando..."
          coverage report || echo "Relatório de cobertura não gerado"

      - name: Verificar formatação básica
        run: |
          python -m black --check agendamentos/ || (echo "Formatação não está correta. Execute 'black agendamentos/' para corrigir." && exit 1)
